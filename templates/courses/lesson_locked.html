{% extends "base.html" %}
{% block title %}{{ lesson.title }} | {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container-page max-w-xl py-20 text-center">
  <span class="mx-auto grid size-16 place-items-center rounded-2xl bg-amber-100 text-2xl text-amber-700 dark:bg-amber-950 dark:text-amber-300"><i class="fa-solid fa-crown" aria-hidden="true"></i></span>
  <h1 class="mt-6 text-3xl font-bold tracking-tight">{{ lesson.title }}</h1>
  <p class="mt-3 text-stone-600 dark:text-stone-400">Този урок е част от Премиум плана, който стартира скоро. Всички останали уроци са безплатни.</p>
  <a href="{{ lesson.unit.level.get_absolute_url }}" class="btn btn-primary mt-8">Обратно към {{ lesson.unit.level.code }}</a>
</div>
{% endblock %}
