{% if form.non_field_errors %}
  <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-900 dark:border-red-900 dark:bg-red-950/50 dark:text-red-100" role="alert">
    {% for error in form.non_field_errors %}<p><i class="fa-solid fa-circle-exclamation mr-1" aria-hidden="true"></i>{{ error }}</p>{% endfor %}
  </div>
{% endif %}
