{% extends "base.html" %}
{% block title %}Страницата не е намерена | {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container-page max-w-xl py-20 text-center">
  <span class="mx-auto grid size-24 -rotate-6 place-items-center rounded-[2rem] bg-gradient-to-br from-sky-500 to-violet-600 text-4xl font-black text-white shadow-xl">404</span>
  <h1 class="mt-8 text-3xl font-black tracking-tight">Тази страница се загуби</h1>
  <p class="mt-3 font-semibold text-stone-600 dark:text-stone-400" lang="en">Sorry, we can't find that page.</p>
  <p class="font-semibold text-stone-600 dark:text-stone-400">Може адресът да е грешен или страницата да е преместена.</p>
  <div class="mt-8 flex flex-wrap justify-center gap-3">
    <a href="{% url 'core:home' %}" class="btn btn-primary">Към началото</a>
    <a href="{% url 'courses:levels' %}" class="btn btn-secondary">Към курса</a>
  </div>
</div>
{% endblock %}
